<style>
[hidden]{display:none!important}
body{background:var(--night)}
.pr-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.pr-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(.5);transform:scale(1.08)}
.pr-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,18,25,.25),rgba(13,18,25,.75))}

.pr{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.pr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr-title{font:400 clamp(22px,4.5vw,30px) var(--display)}
.pr-title small{display:block;font:500 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.pr-title b{font:600 .9em var(--body)}
.pr-hud{display:flex;justify-content:space-between;gap:10px;font:600 16px var(--body);font-variant-numeric:tabular-nums}
.pr-hud span{background:rgba(21,29,39,.78);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px)}
.pr-hud .stars{letter-spacing:2px;color:var(--gold)}

/* поле с карточками */
.pr-grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:clamp(6px,1.8vw,10px);width:100%;margin-inline:auto}
.pr-card{appearance:none;border:0;padding:0;background:none;cursor:pointer;aspect-ratio:3/4;perspective:900px}
.pr-card .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.pr-card.open .in,.pr-card.done .in{transform:rotateY(180deg)}
.pr-card .face{position:absolute;inset:0;border-radius:clamp(8px,2vw,14px);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pr-card .back{border:1px solid rgba(233,194,122,.55);background:radial-gradient(90% 70% at 50% 35%,rgba(233,194,122,.22),transparent 70%),linear-gradient(160deg,#25303d,#121922);display:grid;place-items:center}
.pr-card .back svg{width:46%;height:auto;filter:drop-shadow(0 0 8px rgba(233,194,122,.4))}
.pr-card .front{transform:rotateY(180deg);background:#151d27;border:1px solid var(--line)}
.pr-card .front img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.pr-card.done .front{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.pr-card.done{cursor:default}
.pr-card.miss .front{animation:shake .4s}
@keyframes shake{25%,75%{transform:rotateY(180deg) translateX(-5px)}50%{transform:rotateY(180deg) translateX(5px)}}
.pr-msg{text-align:center;min-height:22px;color:var(--mist)}

/* выбор уровня */
.pr-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr-lv{appearance:none;cursor:pointer;border:1px solid var(--line);border-radius:16px;background:rgba(21,29,39,.85);color:var(--frost);padding:14px 8px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;backdrop-filter:blur(4px)}
.pr-lv b{font:600 22px var(--body)}
.pr-lv small{color:var(--mist);font-size:12px}
.pr-lv .st{color:var(--gold);letter-spacing:2px;font-size:15px}
.pr-lv:hover{border-color:var(--gold)}
.pr-lv:disabled{opacity:.45;cursor:default}
.pr-lv:disabled:hover{border-color:var(--line)}

.pr-modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,8,12,.7);backdrop-filter:blur(4px)}
.pr-box{width:min(420px,100%);background:linear-gradient(165deg,#1f2733,#151d27);border:1px solid rgba(233,194,122,.4);border-radius:22px;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:12px}
.pr-box h2{font-size:28px}
.pr-box .big{font:400 42px/1 var(--body);color:var(--gold);letter-spacing:4px}
.pr-box .btns{justify-content:center}
.pr-note{font-size:13px;color:var(--mist);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.pr-card .in{transition:none}.pr-card.miss .front{animation:none}}
</style>

<script src="../assets/gems.js?v=20261018a"></script>
<script src="cards.js?v=20261018d"></script>
<script>
(function () {
  const CARDS = window.PAIR_CARDS, LEVELS = window.PAIR_LEVELS, KEY = "oskolki-pary", GEM_PER_STAR = 2;
  const $ = id => document.getElementById(id);
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  let st = Object.assign({ stars: {}, best: {} }, load());
  const fmt = t => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
  const starsFor = (t, par) => t <= par ? 3 : t <= par * 1.6 ? 2 : 1;
  const starStr = n => "★".repeat(n) + "☆".repeat(3 - n);
  const SHARD = `<svg viewBox="0 0 120 150" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".45" stop-color="#e3b65f"/><stop offset="1" stop-color="#c8923e"/></linearGradient></defs><polygon points="58,4 112,46 92,146 14,122 6,40" fill="rgba(226,178,90,.12)" stroke="url(#g)" stroke-width="3"/><path d="M58 4 52 70 14 122M52 70 112 46M52 70 92 146M52 70 6 40" fill="none" stroke="rgba(244,214,140,.5)" stroke-width="2"/></svg>`;

  /* ---------- уровни ---------- */
  function menu() {
    stop();
    $("menu").hidden = false; $("play").hidden = true;
    $("title").innerHTML = `<small>Найди пару</small>Выбери уровень`;
    $("levels").innerHTML = LEVELS.map((L, i) => {
      const s = st.stars[i] || 0, open = i === 0 || (st.stars[i - 1] || 0) > 0;
      return `<button class="pr-lv" type="button" data-i="${i}" ${open ? "" : "disabled"}><b>${i + 1}</b><span class="st">${open ? starStr(s) : "🔒"}</span><small>${L.pairs} пар${st.best[i] ? " · " + fmt(st.best[i]) : ""}</small></button>`;
    }).join("");
    $("levels").querySelectorAll("button:not(:disabled)").forEach(b => b.onclick = () => play(+b.dataset.i));
  }

  /* ---------- игра ---------- */
  let lv, deck, first, lock, found, t0, timer, moves;
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function play(i) {
    lv = i; const L = LEVELS[i];
    const pick = shuffle(CARDS.slice()).slice(0, L.pairs);
    deck = shuffle(pick.concat(pick).map(c => ({ c })));
    first = null; lock = false; found = 0; t0 = 0; moves = 0;
    $("menu").hidden = true; $("play").hidden = false;
    $("title").innerHTML = `<small>Найди пару</small>Уровень <b>${i + 1}</b>`;
    $("grid").style.setProperty("--cols", L.cols);
    $("grid").style.setProperty("--rows", Math.ceil(L.pairs * 2 / L.cols));
    fit();
    $("grid").innerHTML = deck.map((d, k) => `<button class="pr-card" type="button" data-k="${k}" aria-label="Карточка ${k + 1}"><span class="in"><span class="face back">${SHARD}</span><span class="face front"><img src="${d.c.src}" alt="" loading="eager"></span></span></button>`).join("");
    $("grid").querySelectorAll(".pr-card").forEach(b => b.onclick = () => flip(+b.dataset.k, b));
    $("msg").textContent = "Открой две карточки";
    hud(); stop();
    window.track && track("pary", "start", "Уровень " + (i + 1));
  }
  const elapsed = () => t0 ? (Date.now() - t0) / 1000 : 0;
  function hud() {
    const L = LEVELS[lv], t = elapsed();
    $("time").textContent = "⏱ " + fmt(t);
    $("pairsLeft").textContent = `${found}/${L.pairs} пар`;
    $("hudStars").textContent = starStr(starsFor(t, L.par));
  }
  /* поле целиком помещается в экран: ширину считаем от высоты, что остаётся под шапкой и счётчиками */
  function fit() {
    if (!lv && lv !== 0) return;
    const L = LEVELS[lv], rows = Math.ceil(L.pairs * 2 / L.cols), g = $("grid"), gap = 8;
    g.style.maxWidth = "";
    const top = g.getBoundingClientRect().top + window.scrollY, room = window.innerHeight - top - 16;
    const cardH = (room - gap * (rows - 1)) / rows, w = (cardH * .75) * L.cols + gap * (L.cols - 1);
    if (w > 180) g.style.maxWidth = Math.floor(w) + "px";
  }
  window.addEventListener("resize", () => { if (!$("play").hidden) fit(); });
  function stop() { clearInterval(timer); timer = null; }
  function flip(k, el) {
    if (lock || el.classList.contains("open") || el.classList.contains("done")) return;
    if (!t0) { t0 = Date.now(); timer = setInterval(hud, 250); }
    el.classList.add("open");
    if (!first) { first = { k, el }; return; }
    moves++;
    const a = first, same = deck[a.k].c.id === deck[k].c.id; first = null;
    if (same) {
      a.el.classList.replace("open", "done"); el.classList.replace("open", "done");
      found++; $("msg").textContent = "Пара: " + deck[k].c.title; hud();
      if (found === LEVELS[lv].pairs) setTimeout(win, 500);
    } else {
      lock = true; a.el.classList.add("miss"); el.classList.add("miss");
      setTimeout(() => { a.el.classList.remove("open", "miss"); el.classList.remove("open", "miss"); lock = false; }, 800);
    }
  }
  function win() {
    stop();
    const L = LEVELS[lv], t = elapsed(), stars = starsFor(t, L.par);
    st = Object.assign({ stars: {}, best: {} }, load());
    const before = st.stars[lv] || 0, gained = Math.max(0, stars - before), gift = gained * GEM_PER_STAR;
    st.stars[lv] = Math.max(before, stars);
    if (!st.best[lv] || t < st.best[lv]) st.best[lv] = Math.round(t * 10) / 10;
    save(st);
    if (gift) GEMS.add(gift, "Найди пару · уровень " + (lv + 1));
    window.track && track("pary", "finish", "Уровень " + (lv + 1) + " · " + "★".repeat(stars));
    const next = lv + 1 < LEVELS.length;
    const tip = stars < 3 ? `На три звезды нужно уложиться в ${fmt(L.par)}.` : "Лучше не бывает!";
    modal(`<h2>Уровень <b style="font:600 .9em var(--body)">${lv + 1}</b> пройден</h2>
      <div class="big">${starStr(stars)}</div>
      <p class="muted" style="margin:0">Время ${fmt(t)}, ходов ${moves}. ${tip}</p>
      <p style="margin:0;font-weight:600;color:${gift ? "var(--gold)" : "var(--mist)"}">${gift ? `+${gift} 💎` : before >= stars ? "Кристаллы за эти звёзды уже получены — попробуй быстрее." : ""}</p>
      <div class="btns">${next ? `<button class="btn btn-main" id="mNext" type="button">Дальше</button>` : ""}<button class="btn btn-ghost" id="mAgain" type="button">Ещё раз</button><button class="btn btn-ghost" id="mMenu" type="button">Уровни</button></div>`);
    if (next) $("mNext").onclick = () => { closeModal(); play(lv + 1); };
    $("mAgain").onclick = () => { closeModal(); play(lv); };
    $("mMenu").onclick = () => { closeModal(); menu(); };
  }
  function modal(html) { $("box").innerHTML = html; $("modal").hidden = false; const b = $("box").querySelector("button"); b && b.focus(); }
  function closeModal() { $("modal").hidden = true; }
  $("toMenu").onclick = menu;

  // заранее грузим картинки, чтобы карточки не мигали при первом открытии
  CARDS.forEach(c => { const im = new Image(); im.src = c.src; });
  GEMS.chip($("gems"), "В «Найди пару» за каждую новую звезду уровня +2 💎.");
  menu();
  GEMS.offerDaily();
})();
</script>
